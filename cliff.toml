# git-cliff configuration. CHANGELOG.md is generated; do not edit it by hand.
# Config reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. Generated by git-cliff.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat/", group = "Features" },
  { message = "^fix/", group = "Fixes" },
  { message = "^up/", group = "Updates" },
  { message = "^add-p/", group = "Packages" },
  { message = "^add/", group = "Added" },
  { message = "^rem/", group = "Removed" },
  { message = "^sm/", group = "Small changes" },
  { message = "^init/", group = "Init" },
  { message = "^hide/", skip = true },
  { message = ".*", group = "Other" },
]
