[package]
name = "win"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Shutdown",
    "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop",
    "Devices_Radios", "Foundation", "Foundation_Collections",
    # reserved for W7 (media, ports, uia, clipboard) so it need not touch this file
    "Media_Control", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
    "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm", "Win32_System_Registry",
] }
thiserror = { workspace = true }
