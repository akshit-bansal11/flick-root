name: Icons

# Manual only (gh workflow run icons.yml): regenerates the Tauri icon set from assets/logo/mark.svg.
# Download with: gh run download <run-id> -n icons
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icons:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons from the mark
        run: pnpm --filter desktop tauri icon ../../assets/logo/mark.svg -o ${{ runner.temp }}/icons

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icons
          path: ${{ runner.temp }}/icons
          if-no-files-found: error
