name: Release

on:
  push:
    tags: ['v*']
  # Manual run (gh workflow run release.yml): builds a test installer as an artifact, no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The installer is UNSIGNED (no code-signing certificate); Windows SmartScreen will warn.
      # Created as a draft: the maintainer reviews and publishes it.
      - name: Build installer and draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for the changes in this release. The installer is unsigned.
          releaseDraft: true

      - name: Build test installer (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis

      - name: Checksum installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exes = Get-ChildItem -Path target -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
          if (-not $exes) { throw 'No NSIS installer found' }
          $lines = $exes | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.Name)"
          }
          # LF endings so `sha256sum -c SHA256SUMS.txt` works on any platform.
          [System.IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt
          New-Item -ItemType Directory -Force installer | Out-Null
          $exes | Copy-Item -Destination installer
          Get-ChildItem -Path target -Recurse -Filter *.sig |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Copy-Item -Destination installer
          Copy-Item SHA256SUMS.txt installer

      - name: Upload checksums to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

      # Download with: gh run download <run-id> -n installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: installer/
          retention-days: 14
