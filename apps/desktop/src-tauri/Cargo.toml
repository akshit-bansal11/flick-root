[package]
name = "desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
launcher-core = { workspace = true }
index-apps = { workspace = true }
index-files = { workspace = true }
features = { workspace = true }
providers = { workspace = true }
win = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
tauri-plugin-clipboard-manager = "2.5.0"
