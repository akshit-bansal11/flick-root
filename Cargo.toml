[workspace]
resolver = "3"
members = [
    "crates/launcher-core",
    "crates/index-apps",
    "crates/index-files",
    "crates/providers",
    "crates/decision",
    "crates/features",
    "crates/win",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["Akshit Bansal"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "http2", "form", "query"] }
url = { version = "2.5", features = ["serde"] }
keyring = { version = "4.2", features = ["windows-native-keyring-store"] }
secrecy = "0.10"
zeroize = "1.9"
rusqlite = { version = "0.40", features = ["bundled"] }
nucleo-matcher = "0.3"
jwalk = "0.9"
notify = "8.2"
rayon = "1.12"
arc-swap = "1.9"
windows = "0.62"
png = "0.18"
fend-core = "1.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
quick-xml = "0.42"
sysinfo = "0.39"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
wiremock = "0.6"
tempfile = "3.27"
regex = "1.13"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
uuid = { version = "1.28", features = ["v4"] }
parking_lot = "0.12"
bytes = "1.12"
percent-encoding = "2.3"

launcher-core = { path = "crates/launcher-core" }
index-apps = { path = "crates/index-apps" }
index-files = { path = "crates/index-files" }
providers = { path = "crates/providers" }
decision = { path = "crates/decision" }
features = { path = "crates/features" }
win = { path = "crates/win" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
